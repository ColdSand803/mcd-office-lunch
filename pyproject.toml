[project]
name = "mcd-office-lunch"
version = "0.1.0"
description = "企业团餐操盘手：按人数和人均预算给出三套方案和 AA。"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

[project.scripts]
mcd-office-lunch = "mcd_office_lunch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
